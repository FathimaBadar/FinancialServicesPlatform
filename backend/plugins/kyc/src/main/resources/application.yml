spring:
  application:
    name: fsp-plugin-kyc
  datasource:
    url: ${FSP_PLUGIN_KYC_DB_URL:jdbc:postgresql://localhost:5432/fsp_plugin_kyc}
    username: ${FSP_PLUGIN_KYC_DB_USER:fsp_plugin_kyc}
    password: ${FSP_PLUGIN_KYC_DB_PASSWORD:fsp_plugin_kyc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

fsp:
  plugin:
    code: kyc
    client-id: plugin-kyc
    # PKCS#8 PEM keys (dev: generated on first boot next to the rest of the gitignored dev PKI)
    client-key: ${FSP_PLUGIN_KYC_CLIENT_KEY:../../../infrastructure/pki/dev/plugin-kyc-client.pem}
    dpop-key: ${FSP_PLUGIN_KYC_DPOP_KEY:../../../infrastructure/pki/dev/plugin-kyc-dpop.pem}
    create-keys: ${FSP_PLUGIN_KYC_CREATE_KEYS:true}
  idp:
    issuer: ${FSP_IDP_ISSUER:https://idp.fsp.local}
  core:
    # the gateway is the plugin's ONLY way to the platform (and the actor-JWKS publisher)
    gatewayUrl: ${FSP_GATEWAY_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} level=%p traceId=%X{traceId} tenantId=%X{tenantId} userId=%X{userId} logger=%c{1} msg=%m ex=%replace(%ex){'\n',' | '}%n"
