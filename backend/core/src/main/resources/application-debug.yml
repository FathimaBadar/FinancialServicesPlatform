# Debug mode: detailed, human-readable multi-line logs (AGENTS.md §2c).
# Activate with the `debug` profile, combinable with others:
#   --spring.profiles.active=client-demo,debug
spring:
  application:
    name: fsp-core

logging:
  level:
    com.fsp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [traceId=%X{traceId}] [tenantId=%X{tenantId}] [userId=%X{userId}] %logger{40} : %L - %msg%n%ex{full}"
